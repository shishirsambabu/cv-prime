<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/brand/brand.css" />
</head>
<body>
  <main class="canvas">
    <span class="counter">5 / 7</span>
    <p class="eyebrow">Line 4</p>
    <h2 class="h3" style="margin-top: 28px; font-size: 58px">“Hardworking team player and quick learner”</h2>
    <div class="stack" style="margin-top: 52px">
      <div class="card">
        <p class="pill bad">✕ Skipped</p>
        <p class="body" style="margin-top: 24px">Every CV says it, so it proves nothing.</p>
      </div>
      <div class="card">
        <p class="pill good">✓ Gets read</p>
        <p class="body" style="margin-top: 24px; color: var(--text)">Learned React in 3 weeks to ship the internal leave dashboard now used by 120 staff.</p>
      </div>
    </div>
    <p class="body" style="margin-top: 24px; font-size: 24px">Illustrative example</p>
    <div class="spacer"></div>
    <div class="brandbar">
      <img src="/public/logo-white.png" alt="CV Prime" />
      <span class="swipe">Swipe →</span>
    </div>
  </main>
</body>
</html>
