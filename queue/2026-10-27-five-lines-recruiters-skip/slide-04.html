<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/brand/brand.css" />
</head>
<body>
  <main class="canvas">
    <span class="counter">4 / 7</span>
    <p class="eyebrow">Line 3</p>
    <h2 class="h3" style="margin-top: 28px; font-size: 58px">“Proficient in MS Office”</h2>
    <div class="stack" style="margin-top: 52px">
      <div class="card">
        <p class="pill bad">✕ Skipped</p>
        <p class="body" style="margin-top: 24px">Too vague to match the skills in a job description.</p>
      </div>
      <div class="card">
        <p class="pill good">✓ Gets read</p>
        <p class="body" style="margin-top: 24px; color: var(--text)">Excel: Power Query, pivot tables, XLOOKUP. Built the weekly sales MIS used by 4 regional heads.</p>
      </div>
    </div>
    <p class="body" style="margin-top: 24px; font-size: 24px">Illustrative example</p>
    <div class="spacer"></div>
    <div class="brandbar">
      <img src="/public/logo-white.png" alt="CV Prime" />
      <span class="swipe">Swipe →</span>
    </div>
  </main>
</body>
</html>
