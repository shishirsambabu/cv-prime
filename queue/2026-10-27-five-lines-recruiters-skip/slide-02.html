<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/brand/brand.css" />
</head>
<body>
  <main class="canvas">
    <span class="counter">2 / 7</span>
    <p class="eyebrow">Line 1</p>
    <h2 class="h3" style="margin-top: 28px; font-size: 58px">“Seeking a challenging role in a reputed organisation”</h2>
    <div class="stack" style="margin-top: 52px">
      <div class="card">
        <p class="pill bad">✕ Skipped</p>
        <p class="body" style="margin-top: 24px">Tells a recruiter nothing they can shortlist on.</p>
      </div>
      <div class="card">
        <p class="pill good">✓ Gets read</p>
        <p class="body" style="margin-top: 24px; color: var(--text)">Backend developer, 3 yrs. Cut API latency 40% on a 1M-user app. Looking for fintech roles in Bengaluru.</p>
      </div>
    </div>
    <p class="body" style="margin-top: 24px; font-size: 24px">Illustrative example</p>
    <div class="spacer"></div>
    <div class="brandbar">
      <img src="/public/logo-white.png" alt="CV Prime" />
      <span class="swipe">Swipe →</span>
    </div>
  </main>
</body>
</html>
