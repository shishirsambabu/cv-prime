<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/brand/brand.css" />
</head>
<body>
  <main class="canvas">
    <span class="counter">6 / 7</span>
    <p class="eyebrow">Line 5</p>
    <h2 class="h3" style="margin-top: 28px; font-size: 58px">Father’s name · DOB · marital status · “I hereby declare…”</h2>
    <div class="stack" style="margin-top: 52px">
      <div class="card">
        <p class="pill bad">✕ Skipped</p>
        <p class="body" style="margin-top: 24px">Uses up space a private-sector recruiter won’t read. Keep it only if the application asks for it (some government roles do).</p>
      </div>
      <div class="card">
        <p class="pill good">✓ Gets read</p>
        <p class="body" style="margin-top: 24px; color: var(--text)">Delete it, and use the space for one more result.</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="brandbar">
      <img src="/public/logo-white.png" alt="CV Prime" />
      <span class="swipe">Swipe →</span>
    </div>
  </main>
</body>
</html>
