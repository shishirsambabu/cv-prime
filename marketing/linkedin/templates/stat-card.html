<!doctype html>
<!-- Single-image template: one big (sourced!) number + the insight + brand bar.

<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/brand/brand.css" />
</head>
<body>
  <main class="canvas">
    <p class="eyebrow">India job market</p>
    <div class="spacer"></div>
