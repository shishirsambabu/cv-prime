<!doctype html>
<!-- Carousel inner slide: one idea per slide, before → after. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/brand/brand.css" />
</head>
<body>
  <main class="canvas">
    <span class="counter">2 / 7</span>
    <p class="eyebrow">Line 1</p>
    <h2 class="h2" style="margin-top: 28px">"Seeking a challenging role in a reputed organisation"</h2>
    <div class="stack" style="margin-top: 56px">
      <div class="card">
        <p class="pill bad">✕ Skipped</p>
        <p class="body" style="margin-top: 24px">Says nothing a recruiter can shortlist on. Every second fresher CV opens with it.</p>
      </div>
      <div class="card">
        <p class="pill good">✓ Read</p>
        <p class="body" style="margin-top: 24px; color: var(--text)">"Backend developer, 2 yrs — cut API latency 40% on a 1M-user app. Looking for fintech roles in Bengaluru."</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="brandbar">
      <img src="/public/logo-white.png" alt="CV Prime" />
      <span class="swipe">Swipe →</span>
    </div>
  </main>
</body>
</html>
